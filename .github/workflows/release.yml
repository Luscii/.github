name: Release
on:
  release:
    types:
      - published

# Promotions queue rather than cancel: the tags move in separate steps, so a
# cancelled run could leave v1.0 short of its last patch, and nothing retries
# it. GitHub keeps only the newest *pending* run per group, so a third release
# published while one runs and one waits still replaces the waiting one.
concurrency:
  group: ci-release
  cancel-in-progress: false

# A called workflow cannot hold more than the caller grants, so the job below
# passes down exactly what promote-release.yml needs to push the moving tags.
permissions: {}

jobs:
  promote_release:
    # `published` also fires for a pre-release. Consumers pin @v1, so a release
    # candidate must never move v1, v1.x or latest.
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/promote-release.yml
    permissions:
      contents: write # to push the moving major/minor/latest tags
    with:
      type: latest
      ref: ${{ github.event.release.tag_name }}
