name: Promote Release
on:
  workflow_call:
    inputs:
      tag:
        type: string
        description: 'The released tag name; only its name is used, to derive X and X.Y'
        required: true
      sha:
        type: string
        description: 'The released commit, which the moving tags point at'
        required: true
      type:
        description: Type of release
        required: true
        type: string

# The job below states what it needs; this only stops the workflow from
# inheriting the repository default. The caller has to grant contents: write.
permissions: {}

jobs:
  create-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the moving major/minor/latest tags
    steps:
      # The commit, not the tag name: a tag is a mutable pointer, and an
      # unqualified ref resolves to a same-named branch first, which anyone
      # with write can push. The release event's commit cannot change.
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.sha }}
      - name: Retrieve all tags
        run: git fetch --prune --unshallow --tags
      - name: Generate tags
        id: tags
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: inputs.type == 'latest'
        env:
          # Never interpolate the tag into the script body: a tag name may
          # contain quotes or backticks, and this step holds a write token.
          TAG: ${{ inputs.tag }}
        with:
          # "1.2.3" gives "1" and "1.2", the moving tags consumers pin (@1).
          script: |
            const version = process.env.TAG
            const major = version.split('.')[0]
            const minor = version.split('.')[1]

            core.setOutput('major', major)
            core.setOutput('minor', [major, minor].join('.'))
      - name: Set tag - ${{ inputs.type }}
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        id: tag
        with:
          tag: ${{ inputs.type }}
          force_push_tag: true
          commit_sha: ${{ inputs.sha }}
      - name: Set tag - Major
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        if: inputs.type == 'latest'
        id: major
        with:
          tag: ${{ steps.tags.outputs.major }}
          force_push_tag: true
          commit_sha: ${{ inputs.sha }}
      - name: Set tag - Minor
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        if: inputs.type == 'latest'
        id: minor
        with:
          tag: ${{ steps.tags.outputs.minor }}
          force_push_tag: true
          commit_sha: ${{ inputs.sha }}
